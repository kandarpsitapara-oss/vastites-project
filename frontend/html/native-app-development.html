<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get native mobile apps from Vastites — built specifically for iOS or Android to deliver maximum performance and platform integration.">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="canonical" href="https://vastites.com/html/native-app-development.html">
    <title>Native App Development | Vast ITES</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sections.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/inner-pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- HEADER (Strict 4-Column Mega Menu) -->
    <div id="site-header"></div>

    <div id="page-content"></div>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('page-content-loaded', () => {
            document.querySelectorAll('.platform-tab-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const targetId = button.getAttribute('data-target');

                    // Update buttons
                    document.querySelectorAll('.platform-tab-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    // Update panes
                    document.querySelectorAll('.platform-pane').forEach(pane => pane.classList.remove('active'));
                    document.getElementById(targetId).classList.add('active');
                });
            });
        });
    </script>
    

    <script src="/js/strapi-config.js"></script>
    <script src="/js/page-loader.js"></script>
    <script src="/js/layout-loader.js"></script>
</body>

</html>
