<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vastites helps you build and launch digital products — from ideation and MVP to full-scale product engineering.">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="canonical" href="https://vastites.com/html/product-development.html">
    <title>Product Development | VAST ITES</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sections.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/inner-pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- HEADER (Strict 4-Column Mega Menu) -->
    <div id="site-header"></div>

    <div id="page-content"></div>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>

    <!-- Mobile Accordion Logic -->
    <script>
        document.addEventListener('page-content-loaded', function () {
            const accordionHeaders = document.querySelectorAll('.mobile-accordion-header');
            const desktopTabs = document.querySelectorAll('.product-tabs-sidebar .v-tab-btn');
            const panes = document.querySelectorAll('.v-tab-pane');

            function switchTab(targetId) {
                // Update Desktop Tabs
                desktopTabs.forEach(tab => {
                    if (tab.getAttribute('data-target') === targetId) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });

                // Update Mobile Accordion Headers
                accordionHeaders.forEach(header => {
                    if (header.getAttribute('data-target') === targetId) {
                        header.classList.add('active');
                    } else {
                        header.classList.remove('active');
                    }
                });

                // Update Panes
                panes.forEach(pane => {
                    if (pane.id === targetId) {
                        pane.classList.add('active');
                        pane.style.display = window.innerWidth <= 768 ? 'block' : ''; // Ensure visibility on mobile
                    } else {
                        pane.classList.remove('active');
                        if (window.innerWidth <= 768) pane.style.display = 'none';
                    }
                });
            }

            // Mobile Click Listener
            accordionHeaders.forEach(header => {
                header.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    switchTab(targetId);
                });
            });

            // Sync Desktop Clicks (Optional override if main.js misses mobile headers)
            desktopTabs.forEach(tab => {
                tab.addEventListener('click', function () {
                    const targetId = this.getAttribute('data-target');
                    // We don't need to call switchTab here if main.js handles it, 
                    // BUT main.js won't update .mobile-accordion-header.
                    // So we SHOULD update at least the headers.
                    accordionHeaders.forEach(header => {
                        header.classList.toggle('active', header.getAttribute('data-target') === targetId);
                    });
                });
            });
        });
    </script>

    

    <script src="/js/strapi-config.js"></script>
    <script src="/js/page-loader.js"></script>
    <script src="/js/layout-loader.js"></script>
</body>

</html>
