<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vastites sets up end-to-end logging and monitoring for your applications — real-time alerts, dashboards, and observability solutions.">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="canonical" href="https://vastites.com/html/logging-monitoring-services.html">
    <title>End-to-end Logging & Monitoring | VAST ITES</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sections.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/inner-pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Logging & Monitoring Hero Custom Styles - Extraordinary IT Edition */
        .logging-hero {
            position: relative;
            padding: 160px 0 120px;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: #fff;
            overflow: hidden;
        }

        .logging-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(255, 192, 29, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
            opacity: 0.6;
            pointer-events: none;
        }

        .logging-hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 70px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .logging-hero-content h1 {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 28px;
            letter-spacing: -2px;
            color: #ffffff;
        }

        .logging-hero-content h1 span {
            display: block;
            color: #FFC01D;
            background: linear-gradient(90deg, #FFC01D, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logging-hero-lead {
            font-size: 20px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 45px;
            max-width: 640px;
        }

        .hero-cta-group {
            display: flex;
            gap: 20px;
            margin-bottom: 60px;
        }

        .btn-hero-primary {
            background: #FFC01D;
            color: #020617;
            padding: 18px 36px;
            border-radius: 12px;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(255, 192, 29, 0.25);
        }

        .btn-hero-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(255, 192, 29, 0.35);
            background: #fdbb0a;
        }

        .btn-hero-secondary {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 18px 36px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-hero-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .hero-trust-bar {
            display: flex;
            align-items: center;
            gap: 30px;
            opacity: 0.7;
        }

        .trust-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
        }

        .trust-icons {
            display: flex;
            gap: 25px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.8);
        }

        .logging-hero-visual {
            position: relative;
        }

        .visual-main-frame {
            position: relative;
            z-index: 1;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            animation: heroFloat 8s ease-in-out infinite;
        }

        .visual-main-frame img {
            width: 100%;
            border-radius: 20px;
            display: block;
        }

        .floating-data-card {
            position: absolute;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: transform 0.3s ease;
        }

        .floating-data-card:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .fdc-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255, 192, 29, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFC01D;
            font-size: 22px;
        }

        .fdc-info h4 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin: 0;
            line-height: 1;
        }

        .fdc-info p {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin: 4px 0 0;
        }

        .fdc-pulse {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @keyframes heroFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-30px) rotate(1deg);
            }
        }

        .card-pos-1 {
            top: -40px;
            right: -20px;
        }

        .card-pos-2 {
            bottom: 40px;
            left: -50px;
        }

        @media (max-width: 1200px) {
            .logging-hero-content h1 {
                font-size: 52px;
            }

            .card-pos-2 {
                left: -20px;
            }
        }

        @media (max-width: 991px) {
            .logging-hero {
                padding: 120px 0 80px;
            }

            .logging-hero-grid {
                grid-template-columns: 1fr;
                gap: 80px;
                text-align: center;
            }

            .logging-hero-lead {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-cta-group {
                justify-content: center;
            }

            .hero-trust-bar {
                justify-content: center;
            }

            .visual-main-frame {
                max-width: 600px;
                margin: 0 auto;
            }

            .card-pos-1 {
                right: 20px;
            }

            .card-pos-2 {
                left: 20px;
            }
        }

        @media (max-width: 576px) {
            .logging-hero-content h1 {
                font-size: 38px;
            }

            .hero-cta-group {
                flex-direction: column;
            }

            .floating-data-card {
                padding: 15px;
            }

            .fdc-info h4 {
                font-size: 18px;
            }

            .card-pos-1 {
                top: -20px;
            }
        }
    </style>
</head>

    <div id="page-content"></div>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>

</html>
