    <style>
        /* Breadcrumb Styles */
        .breadcrumb-section {
            padding-top: calc(var(--header-height) + 60px);
            padding-bottom: 60px;
            background-color: var(--color-bg-gray);
            border-bottom: 1px solid #eee;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: var(--color-primary);
            margin-right: 10px;
        }

        .breadcrumb a:hover {
            color: var(--color-accent);
        }

        .breadcrumb span {
            margin-right: 10px;
            color: #999;
        }

        .breadcrumb .current {
            color: #999;
        }
    </style>
