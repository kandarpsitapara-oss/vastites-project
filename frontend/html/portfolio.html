<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Vastites' portfolio of delivered software, cloud, mobile, and AI projects across diverse industries.">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="canonical" href="https://vastites.com/html/portfolio.html">
    <title>Portfolio - VAST ITES</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sections.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/inner-pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        /* Breadcrumb Styles */
        .breadcrumb-section {
            padding-top: calc(var(--header-height) + 60px);
            padding-bottom: 60px;
            background-color: var(--color-bg-gray);
            border-bottom: 1px solid #eee;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: var(--color-primary);
            margin-right: 10px;
        }

        .breadcrumb a:hover {
            color: var(--color-accent);
        }

        .breadcrumb span {
            margin-right: 10px;
            color: #999;
        }

        .breadcrumb .current {
            color: #999;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .portfolio-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .portfolio-card:hover {
            transform: translateY(-10px);
        }

        .portfolio-image {
            width: 100%;
            height: 250px;
            background: #f0f0f0;
            object-fit: cover;
        }

        .portfolio-info {
            padding: 25px;
        }

        .portfolio-tag {
            color: var(--color-accent);
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 10px;
        }

        .portfolio-info h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--color-text-dark);
        }

        .portfolio-info p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <div id="site-header"></div>

    <div id="page-content"></div>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>

    

    <script src="/js/strapi-config.js"></script>
    <script src="/js/page-loader.js"></script>
    <script src="/js/layout-loader.js"></script>
</body>

</html>
