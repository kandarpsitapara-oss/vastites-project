# ============================================================
# Vastites Backend CI/CD Pipeline
# ============================================================

name: Vastites Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==========================================================
  # BACKEND CI
  # ==========================================================

  ci:
    name: Backend CI
    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Node.js and npm
        run: |
          node -v
          npm -v

      - name: Create Backend .env
        working-directory: ./backend/vastites-cms
        run: |
          printf '%s\n' "${{ secrets.STRAPI_ENV }}" > .env
          echo "✓ .env file created"

      - name: Clean dist directory
        working-directory: ./backend/vastites-cms
        run: |
          rm -rf dist .strapi || true
          mkdir -p dist
          echo "✓ dist and .strapi directories cleaned"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ./backend/vastites-cms/node_modules
          key: ${{ runner.os }}-backend-npm-${{ hashFiles('backend/vastites-cms/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-npm-

      - name: Install Backend Dependencies
        working-directory: ./backend/vastites-cms
        run: |
          npm ci

      - name: Update Browserslist
        working-directory: ./backend/vastites-cms
        run: |
          npx update-browserslist-db@latest

      - name: Verify Required Environment Variables
        working-directory: ./backend/vastites-cms
        run: |
          if grep -q "STRAPI_AI_URL" .env && grep -q "STRAPI_ANALYTICS_URL" .env; then
            echo "✓ All required environment variables present"
          else
            echo "❌ ERROR: Missing required variables - STRAPI_AI_URL or STRAPI_ANALYTICS_URL"
            exit 1
          fi

      - name: Build Backend
        working-directory: ./backend/vastites-cms
        run: |
          npm run build

      - name: Backend CI Successful
        run: |
          echo "========================================="
          echo "✓ Backend CI completed successfully."
          echo "✓ Backend is ready for deployment."
          echo "========================================="


  # ==========================================================
  # BACKEND CD
  # ==========================================================

  cd:
    name: Backend CD
    needs: ci
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EC2 Host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.BACKEND_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "echo '✓ Backend SSH connection successful.'"

      - name: Prepare Deployment Directory
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "sudo mkdir -p '${{ secrets.BACKEND_PATH }}' && sudo chown -R '${{ secrets.BACKEND_USER }}:${{ secrets.BACKEND_USER }}' '${{ secrets.BACKEND_PATH }}'"

      - name: Clean node_modules and dist on EC2
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "rm -rf '${{ secrets.BACKEND_PATH }}/node_modules' '${{ secrets.BACKEND_PATH }}/dist' '${{ secrets.BACKEND_PATH }}/.strapi' || true && echo '✓ Directories cleaned on EC2'"

      - name: Deploy Backend Files
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude=".strapi" \
            --exclude="dist" \
            --exclude="data" \
            ./backend/vastites-cms/ \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}:${{ secrets.BACKEND_PATH }}/"

      - name: Create Backend .env on EC2
        run: |
          printf '%s\n' "${{ secrets.STRAPI_ENV }}" > backend.env

          scp \
            backend.env \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}:${{ secrets.BACKEND_PATH }}/.env"

          rm -f backend.env
          echo "✓ .env file created on EC2"

      - name: Install Backend Dependencies on EC2
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "cd '${{ secrets.BACKEND_PATH }}' && npm ci && echo '✓ Dependencies installed on EC2'"

      - name: Build Backend on EC2
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "cd '${{ secrets.BACKEND_PATH }}' && npm run build && echo '✓ Build completed on EC2'"

      - name: Restart Backend with PM2
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "cd '${{ secrets.BACKEND_PATH }}' && if pm2 list | grep -q strapi-backend; then pm2 restart strapi-backend --update-env; else pm2 start ecosystem.config.js --update-env; fi && echo '✓ PM2 process managed successfully'"

      - name: Verify Backend
        run: |
          ssh \
            "${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }}" \
            "pm2 list && echo '✓ Backend verification completed'"

      - name: Backend CD Successful
        run: |
          echo "========================================="
          echo "✓ Backend CD completed successfully."
          echo "✓ Backend deployment completed."
          echo "========================================="
